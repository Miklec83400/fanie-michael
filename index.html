<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanie & Michaël – Notre calendrier</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e0457b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fanie & Michaël">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff8fb1;--rose2:#ffd3e0;--lav:#b9a7f5;--lav2:#e6defc;--ink:#5a3550;--bg:#fff3f7}
*{box-sizing:border-box;margin:0}
body{font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#ffe3ee,transparent 45%),radial-gradient(circle at 100% 100%,#eae3ff,transparent 45%),var(--bg);min-height:100vh;padding:14px 18px 24px;overflow-x:hidden}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(28px,4.5vw,44px);color:#e0457b;text-align:center;line-height:1.1}
.sub{font-family:'Pacifico',cursive;display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(15px,2.2vw,20px);color:#b3265a;margin:4px 0 12px}
.sub .bf{font-size:1.4em;display:inline-block;animation:flap 2.4s ease-in-out infinite}
.sub .bf:last-child{animation-delay:-1.2s;transform:scaleX(-1)}
@keyframes flap{50%{transform:translateY(-4px) rotate(8deg)}}
.sub .bf:last-child{animation-name:flap2}
@keyframes flap2{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-4px) rotate(8deg)}}
#sync{text-align:center;font-size:12px;opacity:.8;margin:-6px 0 8px}
.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 22px #e0457b22;padding:14px}
.top{display:grid;grid-template-columns:300px 1fr;gap:16px}
.pic{width:100%;aspect-ratio:1.25;border-radius:18px;background:linear-gradient(160deg,#ffe3ee,#eae3ff);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.pic svg{width:100%;height:100%}
.pic::before,.pic::after{position:absolute;z-index:3;font-size:24px;line-height:1;filter:drop-shadow(0 1px 2px #0003)}
.pic::before{content:'💖';top:8px;left:10px}
.pic::after{content:'💖';bottom:8px;right:10px}
.pic .bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(14px) brightness(1.05);opacity:.85}
.pic .fg{position:relative;width:100%;height:100%;object-fit:contain}
.mini{display:flex;gap:6px;margin-top:8px}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--rose2);color:#b3265a;border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px}
.btn:hover{background:var(--rose);color:#fff}
.stcard{display:flex;align-items:center;justify-content:center;padding:18px 26px 18px 40px}
.bubble{position:relative;width:100%;max-width:720px;border-radius:30px;padding:22px 28px;text-align:center;font-weight:700;line-height:1.35;font-size:clamp(18px,2.5vw,28px);box-shadow:0 4px 14px #e0457b22}
.bubble.here{background:var(--rose2)}.bubble.away{background:var(--lav2)}
.bubble::before{content:'';position:absolute;left:-16px;top:50%;margin-top:-14px;border:14px solid transparent;border-right-color:inherit;border-left:0}
.bubble.here::before{border-right-color:var(--rose2)}.bubble.away::before{border-right-color:var(--lav2)}
.bubble small{display:block;font-size:.72em;margin-top:8px;font-weight:700;opacity:.85}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{font-family:'Pacifico',cursive;font-weight:400;font-size:24px;color:#e0457b;text-transform:capitalize}
.nav{background:var(--rose2);color:#b3265a;border-radius:50%;width:36px;height:36px;font-size:18px;font-weight:700}
.nav:hover{background:var(--rose);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-weight:700;font-size:12px;opacity:.7;padding-bottom:2px}
.day{min-height:74px;border-radius:12px;padding:5px 3px 3px;position:relative;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.day:hover{border-color:#e0457b}
.day.out{opacity:.35}
.day .n{width:26px;height:26px;line-height:26px;border-radius:50%;text-align:center;font-weight:700;font-size:13px;flex:none}
.day.today .n{background:#e0457b;color:#fff}
.day .sw{position:absolute;top:4px;right:5px;font-size:13px;line-height:1}
.day .jm{position:absolute;bottom:3px;right:5px;font-size:12px;line-height:1}
.day .ev{width:100%;text-align:center;font-size:11px;font-weight:600;background:#ffffffcc;border-radius:6px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.year h3{font-size:14px;margin-bottom:8px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mb{background:#fff6fa;border-radius:14px;padding:8px}
.mb.on{outline:2px solid #e0457b}
.mb h4{font-size:13px;text-transform:capitalize;margin-bottom:6px;text-align:center;color:#b3265a}
.mw{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.wk{border-radius:9px;padding:4px 6px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;line-height:1.2}
.wk.cur{outline:2px solid #e0457b}
.here-bg{background:var(--rose2)}
.away-bg{background:var(--lav2)}
.modal{position:fixed;inset:0;background:#5a355088;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.open{display:flex}
.box{background:#fff;border-radius:22px;padding:18px;width:min(400px,100%);box-shadow:0 10px 40px #0004;max-height:92vh;overflow:auto}
.box h4{font-family:'Pacifico',cursive;font-weight:400;font-size:20px;color:#e0457b;text-transform:capitalize}
.box .st{font-size:13px;font-weight:600;margin:4px 0 10px;min-height:4px}
.box ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px;margin-bottom:10px;max-height:160px;overflow:auto}
.box li{display:flex;justify-content:space-between;align-items:center;background:#fff6fa;border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
.box li button{background:none;color:#b3265a;font-size:16px}
.row{display:flex;gap:6px}
input[type=text]{flex:1;font:inherit;border:2px solid var(--rose2);border-radius:12px;padding:7px 10px;min-width:0}
.emo{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
.emo button{background:#fff6fa;border-radius:10px;font-size:18px;padding:3px 7px}
.emo button:hover{background:var(--rose2)}
#who button.sel,.tabs button.sel{background:var(--rose);color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--rose2);color:#b3265a;border-radius:14px;padding:6px;font-weight:700;font-size:13px}
#jlist{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:240px;overflow:auto}
.je{background:#fff6fa;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:600}
.je small{opacity:.55;display:flex;justify-content:space-between;align-items:center}
.je small button{background:none;color:#b3265a;font-size:15px}
.je img{display:block;max-width:100%;max-height:150px;border-radius:10px;margin-top:6px;cursor:zoom-in}
.je p{white-space:pre-wrap;margin-top:3px}
textarea{width:100%;font:inherit;border:2px solid var(--rose2);border-radius:12px;padding:7px 10px;resize:vertical}
#jprev img{max-height:90px;border-radius:10px;margin-top:6px}
.float{position:fixed;bottom:-40px;font-size:22px;opacity:.7;pointer-events:none;animation:up linear infinite;z-index:1}
@keyframes up{to{transform:translateY(-115vh) translateX(30px) rotate(20deg)}}
@media(prefers-reduced-motion:reduce){.float,.sub .bf{display:none}}
@media(max-width:1100px){.months{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){
 body{padding:10px}
 .top{grid-template-columns:1fr}
 .stcard{padding:18px 14px}
 .bubble::before{left:50%;top:-16px;margin:0 0 0 -14px;border:14px solid transparent;border-bottom-color:inherit;border-top:0}
 .bubble.here::before{border-bottom-color:var(--rose2);border-right-color:transparent}
 .bubble.away::before{border-bottom-color:var(--lav2);border-right-color:transparent}
 .pic{aspect-ratio:1.7}
 .day{min-height:54px;padding:3px 1px 2px}
 .day .n{width:22px;height:22px;line-height:22px;font-size:12px}
 .day .sw{font-size:9px;top:1px;right:1px}
 .day .jm{font-size:9px;bottom:1px;right:1px}
 .day .ev{font-size:0;padding:0;width:6px;height:6px;border-radius:50%;background:#e0457b;display:inline-block}
 .months{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<h1>Fanie & Michaël 💕</h1>
<p class="sub"><span class="bf">🦋</span><span>Notre petit calendrier d'amour</span><span class="bf">🦋</span></p>
<div id="sync"></div>

<div class="page">
 <div class="top">
  <div class="card">
   <div class="pic" id="pic"></div>
   <div class="mini">
    <button class="btn" id="addPhoto">📷 Notre photo</button>
    <button class="btn" id="rmPhoto" style="display:none">✖</button>
    <input type="file" id="file" accept="image/*" hidden>
   </div>
  </div>
  <div class="card stcard"><div class="bubble" id="status"></div></div>
 </div>

 <div class="card" id="cal">
  <div class="cal-head">
   <button class="nav" id="prev" aria-label="Mois précédent">‹</button>
   <h2 id="title"></h2>
   <button class="nav" id="nextm" aria-label="Mois suivant">›</button>
  </div>
  <div class="grid" id="grid"></div>
 </div>

 <div class="card year">
  <h3 id="ytitle"></h3>
  <div class="months" id="months"></div>
 </div>
</div>

<div class="modal" id="modal">
 <div class="box">
  <h4 id="mdate"></h4>
  <div class="st" id="mst"></div>
  <div class="tabs"><button id="tabR" class="sel">📅 Rendez-vous</button><button id="tabJ">📖 Journal</button></div>
  <div id="paneR">
   <ul id="mlist"></ul>
   <div class="emo" id="emo"></div>
   <div class="row">
    <input type="text" id="mtxt" placeholder="Un petit rendez-vous, un projet…" maxlength="60">
    <button class="btn" id="madd">Ajouter</button>
   </div>
  </div>
  <div id="paneJ" style="display:none">
   <div id="jlist"></div>
   <textarea id="jtxt" rows="3" maxlength="1000" placeholder="Notre journée, un souvenir, un petit mot…"></textarea>
   <div id="jprev"></div>
   <div class="row" style="margin-top:6px">
    <button class="btn" id="jphoto">📷 Photo</button>
    <button class="btn" id="jadd" style="margin-left:auto">Publier 💕</button>
    <input type="file" id="jfile" accept="image/*" hidden>
   </div>
  </div>
  <div style="text-align:right;margin-top:10px"><button class="btn" id="mclose">Fermer</button></div>
 </div>
</div>

<div class="modal" id="codeModal">
 <div class="box">
  <h4>Bienvenue 💕</h4>
  <div class="st" id="cmsg"></div>
  <div class="emo" id="who"><button data-w="Fanie">💖 Je suis Fanie</button><button data-w="Michaël">💙 Je suis Michaël</button></div>
  <div class="row"><input type="text" id="ccode" placeholder="Code secret" autocomplete="off"><button class="btn" id="cok">OK</button></div>
 </div>
</div>
<div class="modal" id="zoom" style="z-index:30"><img id="zimg" alt="" style="max-width:96vw;max-height:92vh;border-radius:14px"></div>

<script>
const DAY=86400000, REF=Date.UTC(2026,10,16)/DAY; // lundi 16 novembre 2026 : retrouvailles (le rythme alterne ensuite)
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const $=id=>document.getElementById(id);
const mod=(a,b)=>((a%b)+b)%b;
const dn=(y,m,d)=>Math.round(Date.UTC(y,m,d)/DAY);
const toDate=n=>new Date(n*DAY);
const dow=n=>mod(toDate(n).getUTCDay()+6,7);
const weekK=n=>(n-dow(n)-REF)/7;
const hereWeek=k=>mod(k,2)===0;
const key=n=>{const d=toDate(n);return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate()};
const fmt=n=>{const d=toDate(n);return JOURS[dow(n)]+' '+d.getUTCDate()+' '+MOIS[d.getUTCMonth()]};
const p2=x=>String(x).padStart(2,'0');
// état pendant la journée n : [avant 18h, après 18h]
function dayState(n){const k=weekK(n);const cur=hereWeek(k);return dow(n)===0?[hereWeek(k-1),cur]:[cur,cur]}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Données partagées (Supabase) */
const SB='https://vshxudfhstondwcdpdxs.supabase.co/rest/v1/rpc/',SBK='sb_publishable_Xr_YRN1_gHMhbUbF2lHP1g_moCLsvQA';
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let code=lsGet('fm-code'),who=lsGet('fm-who'),store={},journal={};
async function rpc(fn,args){
  const r=await fetch(SB+fn,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||String(r.status));
  return j;
}
function setSync(ok){$('sync').textContent=ok?'':'📴 hors ligne — réessaie plus tard'}
async function load(){
  if(!code){askCode();return}
  try{
    const [rows,jrows]=await Promise.all([rpc('cal_list',{p:code}),rpc('cal_j_list',{p:code})]);store={};journal={};
    const kk=s=>{const [y,m,d]=s.split('-').map(Number);return y+'-'+m+'-'+d};
    rows.forEach(r=>{const k=kk(r.jour);(store[k]=store[k]||[]).push({id:r.id,t:r.texte,a:r.auteur})});
    jrows.forEach(r=>{const k=kk(r.jour);(journal[k]=journal[k]||[]).push({id:r.id,t:r.texte,a:r.auteur,p:r.has_photo})});
    setSync(true);renderCal();if($('modal').classList.contains('open')){renderList();renderJournal()}
  }catch(e){
    if(/code/i.test(e.message)){code='';lsSet('fm-code','');askCode('Code incorrect, réessaie 💭')}else setSync(false);
  }
}
function askCode(msg){
  $('cmsg').textContent=msg||'Entre le code secret 💌';
  $('codeModal').classList.add('open');
}
document.querySelectorAll('#who button').forEach(b=>b.onclick=()=>{who=b.dataset.w;lsSet('fm-who',who);document.querySelectorAll('#who button').forEach(x=>x.classList.toggle('sel',x===b))});
if(who)document.querySelectorAll('#who button').forEach(x=>x.classList.toggle('sel',x.dataset.w===who));
$('cok').onclick=()=>{const v=$('ccode').value.trim();if(!v)return;code=v;lsSet('fm-code',v);if(!who){who='Fanie';lsSet('fm-who',who)}$('codeModal').classList.remove('open');load()};
$('ccode').onkeydown=e=>{if(e.key==='Enter')$('cok').click()};
setInterval(()=>{if(code&&!document.hidden)load()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});

const now=new Date();
const todayN=dn(now.getFullYear(),now.getMonth(),now.getDate());
let vy=now.getFullYear(),vm=now.getMonth();

/* Photo du cadre */
const COUPLE=`<svg viewBox="0 0 250 200" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="g" cx=".5" cy=".4"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffd3e0"/></radialGradient></defs>
<circle cx="125" cy="100" r="92" fill="url(#g)"/>
<g><path d="M70 120q-6 50 4 62h40q10-12 4-62z" fill="#ff8fb1"/>
<circle cx="94" cy="98" r="19" fill="#ffe0c8"/>
<path d="M74 98q-4-26 20-26t20 26q-6-14-20-14t-20 14z" fill="#8a4b2b"/><path d="M74 96q-8 30 2 40q4-18 6-30z" fill="#8a4b2b"/><path d="M114 96q8 30-2 40q-4-18-6-30z" fill="#8a4b2b"/>
<circle cx="88" cy="100" r="2" fill="#5a3550"/><circle cx="100" cy="100" r="2" fill="#5a3550"/>
<path d="M89 107q5 4 10 0" stroke="#d6336c" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="83" cy="106" r="3.5" fill="#ff9db8" opacity=".7"/><circle cx="105" cy="106" r="3.5" fill="#ff9db8" opacity=".7"/></g>
<g><path d="M136 124q-4 48 2 58h42q6-10 2-58z" fill="#7fa7ff"/>
<circle cx="160" cy="100" r="19" fill="#ffe0c8"/>
<path d="M141 98q0-24 19-24t19 24q-4-10-19-10t-19 10z" fill="#4b3a33"/>
<circle cx="154" cy="102" r="2" fill="#5a3550"/><circle cx="166" cy="102" r="2" fill="#5a3550"/>
<path d="M155 109q5 4 10 0" stroke="#d6336c" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="149" cy="108" r="3.5" fill="#ff9db8" opacity=".7"/><circle cx="171" cy="108" r="3.5" fill="#ff9db8" opacity=".7"/></g>
<circle cx="126" cy="150" r="7" fill="#ffe0c8"/>
<text x="112" y="40" font-size="20">💖</text>
</svg>`;
function renderPic(){
  const img=lsGet('fm-photo');
  // photo affichée en entier (rien n'est coupé) sur un fond flou de la même photo
  $('pic').innerHTML=img?`<img class="bg" alt="" src="${img}"><img class="fg" alt="Fanie et Michaël" src="${img}">`:COUPLE;
  $('rmPhoto').style.display=img?'':'none';
}
function readImg(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
$('addPhoto').onclick=()=>$('file').click();
$('rmPhoto').onclick=()=>{try{localStorage.removeItem('fm-photo')}catch(e){}renderPic()};
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  lsSet('fm-photo',await readImg(f,900,.85));renderPic();e.target.value='';
};

/* Bulle du statut */
function renderStatus(){
  const h=now.getHours()+now.getMinutes()/60;
  const st=dayState(todayN);const here=h<18?st[0]:st[1];
  let m=todayN-dow(todayN);if(m<todayN||(m===todayN&&h>=18))m+=7;
  const diff=m-todayN;
  const el=$('status');el.className='bubble '+(here?'here':'away');
  if(here){
    el.innerHTML=`Câlins à volonté ${diff===0?"jusqu'à ce soir":"jusqu'au "+fmt(m)} ! 🤗<small>Bisous, bisous 😘</small>`;
  }else{
    const when=diff===0?"ce soir":diff===1?`demain (${fmt(m)})`:`le ${fmt(m)}, dans ${diff} jours`;
    el.innerHTML=`On se retrouve ${when} ! 🥰<small>Bisous, bisous 😘💋</small>`;
  }
}

/* Calendrier du mois */
function renderCal(){
  $('title').textContent=MOIS[vm]+' '+vy;
  const first=dn(vy,vm,1),last=dn(vy,vm+1,0);
  const start=first-dow(first),end=last+(6-dow(last));
  let html=['L','M','M','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let n=start;n<=end;n++){
    const d=toDate(n),[a,b]=dayState(n);
    const light=x=>x?'#ffc2d6':'#d4c8fa';
    let bg;
    if(dow(n)===0&&a!==b)bg=`linear-gradient(90deg,${light(a)} 75%,${light(b)} 75%)`;else bg=light(b);
    const evs=(store[key(n)]||[]);
    const sw=(a||b)?'💖':'';
    const jm=(journal[key(n)]||[]).length?'<span class="jm">📖</span>':'';
    html+=`<button class="day${d.getUTCMonth()!==vm?' out':''}${n===todayN?' today':''}" style="background:${bg}" data-n="${n}">
      <span class="n">${d.getUTCDate()}</span><span class="sw">${sw}</span>${jm}
      ${evs.slice(0,2).map(e=>`<span class="ev">${esc(e.t)}</span>`).join('')}</button>`;
  }
  $('grid').innerHTML=html;
  $('grid').querySelectorAll('.day').forEach(b=>b.onclick=()=>openDay(+b.dataset.n));
  renderMonths();
}

/* Toute l'année, mois par mois */
function renderMonths(){
  $('ytitle').textContent=`Toute l'année ${vy} 💕`;
  const curW=todayN-dow(todayN);
  let html='';
  for(let m=0;m<12;m++){
    const first=dn(vy,m,1),last=dn(vy,m+1,0);
    let n=first+mod(7-dow(first),7); // premier lundi du mois
    let chips='';
    for(;n<=last;n+=7){
      const here=hereWeek(weekK(n));const d=toDate(n);
      chips+=`<button class="wk ${here?'here-bg':'away-bg'}${n===curW?' cur':''}" data-m="${m}" title="Semaine du ${fmt(n)}">${p2(d.getUTCDate())}.${p2(m+1)}${here?' 💖':''}</button>`;
    }
    html+=`<div class="mb${m===vm?' on':''}"><h4>${MOIS[m]}</h4><div class="mw">${chips}</div></div>`;
  }
  $('months').innerHTML=html;
  $('months').querySelectorAll('.wk').forEach(b=>b.onclick=()=>{vm=+b.dataset.m;renderCal();$('cal').scrollIntoView({behavior:'smooth',block:'start'})});
}
$('prev').onclick=()=>{vm--;if(vm<0){vm=11;vy--}renderCal()};
$('nextm').onclick=()=>{vm++;if(vm>11){vm=0;vy++}renderCal()};

/* Fenêtre d'un jour */
let curN=null,jpending=null;const pcache={};
['🍽️','🎬','✈️','🎂','💌','🛒','🌹','🎉'].forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>{$('mtxt').value=e+' '+$('mtxt').value.replace(/^\p{Extended_Pictographic}️?\s*/u,'');$('mtxt').focus()};$('emo').appendChild(b)});
function openDay(n){
  curN=n;$('mdate').textContent=fmt(n);
  const [a,b]=dayState(n);
  $('mst').textContent=dow(n)===0&&a!==b?(b?'💖 Retrouvailles !':'🌙 À bientôt'):(b?'💖 Ensemble':'');
  jpending=null;$('jtxt').value='';$('jprev').innerHTML='';showTab('R');
  renderList();renderJournal();$('modal').classList.add('open');$('mtxt').value='';
}
function renderList(){
  const l=store[key(curN)]||[];
  $('mlist').innerHTML=l.length?l.map(e=>`<li><span>${esc(e.t)}${e.a?` <small style="opacity:.55">· ${esc(e.a)}</small>`:''}</span><button data-id="${e.id}" aria-label="Supprimer">✕</button></li>`).join(''):'<li style="opacity:.6">Rien de prévu pour l\'instant 💭</li>';
  $('mlist').querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{await rpc('cal_del',{p:code,i:+b.dataset.id});await load()}catch(e){setSync(false)}});
}
async function addEv(){
  const t=$('mtxt').value.trim();if(!t)return;
  const d=toDate(curN);const j=d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());
  try{await rpc('cal_add',{p:code,j:j,t:t,a:who||null});$('mtxt').value='';await load()}catch(e){setSync(false)}
}
$('madd').onclick=addEv;$('mtxt').onkeydown=e=>{if(e.key==='Enter')addEv()};
$('mclose').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};

/* Journal du jour */
function showTab(t){
  $('paneR').style.display=t==='R'?'':'none';$('paneJ').style.display=t==='J'?'':'none';
  $('tabR').classList.toggle('sel',t==='R');$('tabJ').classList.toggle('sel',t==='J');
}
$('tabR').onclick=()=>showTab('R');$('tabJ').onclick=()=>showTab('J');
function renderJournal(){
  if(curN===null)return;
  const jl=journal[key(curN)]||[];
  $('tabJ').textContent='📖 Journal'+(jl.length?` (${jl.length})`:'');
  $('jlist').innerHTML=jl.length?jl.map(e=>`<div class="je"><small><span>${esc(e.a||'')}</span><button data-id="${e.id}" aria-label="Supprimer">✕</button></small>${e.t?`<p>${esc(e.t)}</p>`:''}${e.p?`<img data-id="${e.id}" alt="">`:''}</div>`).join(''):'<div class="je" style="opacity:.6">Pas encore de souvenir ce jour-là 💭</div>';
  $('jlist').querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{await rpc('cal_j_del',{p:code,i:+b.dataset.id});await load()}catch(e){setSync(false)}});
  $('jlist').querySelectorAll('img').forEach(async im=>{
    const id=+im.dataset.id;
    try{if(!pcache[id])pcache[id]=await rpc('cal_j_photo',{p:code,i:id});im.src=pcache[id]}catch(e){}
    im.onclick=()=>{$('zimg').src=im.src;$('zoom').classList.add('open')};
  });
}
$('zoom').onclick=()=>$('zoom').classList.remove('open');
$('jphoto').onclick=()=>$('jfile').click();
$('jfile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  let d=await readImg(f,900,.7);if(d.length>440000)d=await readImg(f,640,.6);
  jpending=d;$('jprev').innerHTML=`<img alt="" src="${d}">`;e.target.value='';
};
$('jadd').onclick=async()=>{
  const t=$('jtxt').value.trim();if(!t&&!jpending)return;
  const d=toDate(curN);const j=d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());
  try{await rpc('cal_j_add',{p:code,j:j,t:t,a:who||null,ph:jpending});jpending=null;$('jtxt').value='';$('jprev').innerHTML='';await load()}catch(e){setSync(false)}
};

/* Petits cœurs et papillons */
['💕','🦋','💖','🦋','💗','🦋','💞'].forEach((e,i)=>{const s=document.createElement('span');s.className='float';s.textContent=e;s.style.left=(8+i*13)+'%';s.style.animationDuration=(14+i*3)+'s';s.style.animationDelay=(-i*4)+'s';document.body.appendChild(s)});

/* Installation comme appli */
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

renderPic();renderStatus();renderCal();load();
</script>
</body>
</html>
